# Shot list for "How GPS Works". Timing keys: sN = start of narration sentence N in the scene.
scenes:
  - id: hook
    template: title
    title: How GPS Works
    subtitle: Turning time into position
    kicker: Theory explainer
    icon: satellite
    hold: 0.4

  - id: constellation
    template: orbit
    heading: A constellation of clocks
    planes: 6
    sats_per_plane: 4
    orbits_at: 0.4
    sats_at: s1+0.8
    links_at: s3+0.6
    labels:
      - {title: "~31", text: "operational satellites", at: s1+0.4}
      - {title: "20,200 km", text: "medium Earth orbit", at: s1+2.2}
      - {title: "2 orbits / day", text: "about 12 hours each", at: s2}
      - {title: "6 planes", text: "tilted 55° to the equator", at: s2+1.8}

  - id: signal
    template: signal
    heading: Measuring time of flight
    emit_at: s1+0.8
    packet:
      - {text: "ID: satellite 12", at: s1+1.6}
      - {text: "Where: orbit data", at: s1+2.6}
      - {text: "Sent: 12:00:00.000", at: s1+3.6}
    receive_at: s2
    receive_label: "Arrived: 12:00:00.067"
    delta_at: s3
    delta_label: "Δt ≈ 67 ms"
    formula: "distance = c × Δt"
    formula_at: s3+1.2
    result: "≈ 20,000 km"
    result_at: s4+0.8

  - id: trilateration
    template: trilateration
    heading: Trilateration
    target: {x: 0.5, y: 0.55, px: 0.5, py: 0.55}
    anchors:
      - {label: "Sat 1", x: 0.38, y: 0.3, px: 0.25, py: 0.25, at: s1}
      - {label: "Sat 2", x: 0.62, y: 0.3, px: 0.78, py: 0.22, at: s2}
      - {label: "Sat 3", x: 0.65, y: 0.66, px: 0.8, py: 0.72, at: s3}
    fix_at: s3+2.4
    fix_label: You are here

  - id: clock
    template: trilateration
    heading: Why a fourth satellite?
    bands: true
    target: {x: 0.5, y: 0.55, px: 0.5, py: 0.52}
    anchors:
      - {label: "Sat 1", x: 0.4, y: 0.3, px: 0.26, py: 0.24, at: 0.3}
      - {label: "Sat 2", x: 0.6, y: 0.28, px: 0.76, py: 0.22, at: 0.5}
      - {label: "Sat 3", x: 0.63, y: 0.7, px: 0.8, py: 0.72, at: 0.7}
      - {label: "Sat 4", x: 0.37, y: 0.72, px: 0.22, py: 0.74, at: s2+0.6}
    tighten_at: s2+2.2
    fix_at: s2+3.4
    fix_label: Position + clock error solved
    notes:
      - {text: "1 ms of clock error ≈ 300 km", at: s1+2.2}
      - {text: "4 unknowns: lat · long · altitude · clock", at: s2+1.2}

  - id: relativity
    template: stat
    heading: Einstein's correction
    prefix: "+"
    value: "38"
    unit: "µs / day"
    label: Net clock gain in orbit, relative to the ground
    at: s3
    bars:
      - {label: "Speed: special relativity", value: 7, display: "−7 µs", color: cold, at: s1+0.3}
      - {label: "Gravity: general relativity", value: 45, display: "+45 µs", color: hot, at: s2+0.3}
    note: "Uncorrected: ~10 km of drift per day"
    note_at: s3+2.6

  - id: errors
    template: cutaway
    heading: Real-world errors
    ray_at: s1
    ray_label: GPS signal
    center_icon: phone
    layers:
      - {label: Ionosphere, sub: "Slows the signal (depends on frequency)", color: violet, at: s2}
      - {label: Troposphere, sub: "Water vapour bends and delays it", color: cyan, at: s2+1.8}
      - {label: Buildings, sub: "Reflections cause multipath", color: amber, at: s2+3.4}
      - {label: Receiver, sub: "Dual frequency + Galileo + ground corrections", color: mint, at: s3}

  - id: recap
    template: recap
    heading: GPS is a timing system
    hold: 2.2
    title: "Time → Position"
    end_at: s2+3.0
    items:
      - {text: "Atomic clocks in orbit", icon: clock, at: s1+0.4}
      - {text: "Signals at light speed", icon: signal, color: violet, at: s2}
      - {text: "distance = c × Δt", icon: bolt, color: amber, at: s2+1.3}
      - {text: "4 satellites, 4 unknowns", icon: satellite, color: mint, at: s2+2.6}
